# AACP — Cloudflare Workers yapılandırması
#
# Gizli değerler BURAYA YAZILMAZ; `wrangler secret put <AD>` ile eklenir
# (bkz. docs/CLOUDFLARE-SUPABASE-KURULUM.md).
# ...
name = "aacp-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Node yerleşiklerinin (crypto vb.) Workers'ta çalışması için.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# --- Gizli olmayan ayarlar ----------------------------------------------------
[vars]
# Supabase proje adresi (gizli değil; anahtarlar gizlidir).
SUPABASE_URL = "https://gagracdjloiklqafxvtz.supabase.co"
# Telemetri toplansın mı.
ANALYTICS_ENABLED = "true"
# APNs: üretim sunucusu mu kullanılsın (false → sandbox).
APNS_PRODUCTION = "false"
# Bildirimlerin apns-topic değeri (uygulamanın bundle kimliği).
APNS_BUNDLE_ID = "com.aa.podcast"
# İzin verilen CORS kaynakları (virgülle). Boş = yalnızca native istemciler.
CORS_ORIGINS = ""

# --- NoSQL (KV) ---------------------------------------------------------------
# Yüksek hacimli, ilişkisiz kullanıcı durumu: kaldığın yer + tercihler.
# Namespace'i bir kez oluşturun ve id'yi buraya yazın:
#   npx wrangler kv namespace create USER_STATE
# Bağlanmazsa bu koleksiyonlar Postgres'e düşer (servis çalışmaya devam eder).
[[kv_namespaces]]
binding = "USER_STATE"
id = "e685c980b738415d9d85373dbbb9c447"

# --- Kuyruk -------------------------------------------------------------------
# Feed taraması şov başına bir iş olarak kuyruğa verilir; böylece tarama süresi
# şov sayısıyla lineer büyümez ve bir şovun hatası diğerlerini etkilemez.
# Kuyruğu bir kez oluşturun:
#   npx wrangler queues create aacp-feed-scan
# Bağlanmazsa tarama sınırlı sayıda şov için satır içi çalışır (servis düşmez).
[[queues.producers]]
queue = "aacp-feed-scan"
binding = "FEED_SCAN"

[[queues.consumers]]
queue = "aacp-feed-scan"
# Parti büyüklüğü ölçülü tutulur: her mesaj bir feed indirmesi ve birkaç
# veritabanı yazması demek; çok büyük parti tek çağrının süresini şişirir.
max_batch_size = 10
max_batch_timeout = 30
# Geçici ağ hatalarına tolerans; kalıcı hata sonunda mesaj düşer.
max_retries = 3

# --- Zamanlanmış görevler -----------------------------------------------------
# Takip edilen şovlarda yeni bölüm taraması (30 dakikada bir).
[triggers]
crons = ["*/30 * * * *"]

# --- Ortamlar -----------------------------------------------------------------
# Staging'i ayrı bir Worker olarak yayınlamak için:
#   wrangler deploy --env staging
[env.staging]
name = "aacp-api-staging"

[env.staging.vars]
SUPABASE_URL = ""
ANALYTICS_ENABLED = "true"
APNS_PRODUCTION = "false"
APNS_BUNDLE_ID = "com.aa.podcast"
CORS_ORIGINS = ""
