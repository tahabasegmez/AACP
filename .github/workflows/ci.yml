name: CI

# Push ve PR'larda tip kontrolü + lint + testleri çalıştırır (kalite kapısı).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # react-native-carplay eski peer aralıkları bildirdiği için legacy-peer-deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  # Backend ayrı bir Node projesi (server/): kendi bağımlılıkları ve testleri var.
  # Ayrı iş olarak koşar ki biri kırılınca diğerinin sonucu yine görünsün.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + Test
        run: npm run ci

      - name: Docker imajı derlenebiliyor mu
        run: docker build -t aacp-server:ci .
