name: CI

# Push ve PR'larda tip kontrolü + lint + testleri çalıştırır (kalite kapısı).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # react-native-carplay eski peer aralıkları bildirdiği için legacy-peer-deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  # API ayrı bir Cloudflare Workers projesi (worker/): kendi bağımlılıkları ve
  # testleri var. Ayrı iş olarak koşar ki biri kırılınca diğerinin sonucu yine
  # görünsün.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck + Test
        run: npm run ci
