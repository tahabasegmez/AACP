# AACP backend — tek komutla dağıtım.
#
# Sunucudan bağımsızdır: Raspberry Pi 5 (arm64), kurumsal sunucu veya kiralık
# VPS (amd64) fark etmez. Ayarlar `.env` dosyasından okunur (bkz. .env.example).
#
#   docker compose up -d --build
#
# TLS: bu servis düz HTTP konuşur. Üretimde önüne bir ters proxy (Caddy, nginx,
# Traefik) koyup HTTPS'i orada sonlandırın — iOS App Transport Security düz
# HTTP'ye izin vermez.

services:
  api:
    build: .
    image: aacp-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /data
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Kalıcı veri: SQLite veritabanı + (isteğe bağlı) shows.json
      - aacp-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aacp-data:
